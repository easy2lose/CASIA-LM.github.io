<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DialectS2S: End-to-End Speech Dialogue Modeling for Low-Resource Chinese Dialects">
    <title>DialectS2S</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.1/css/bulma.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

    <style>
        body {
            font-family: "Google Sans", "Noto Sans", sans-serif;
        }

        .page-container {
            max-width: 1400px;
        }

        .method-image {
            display: block;
            max-width: 100%;
            margin: 25px auto 0;
        }

        .demo-table th,
        .demo-table td {
            text-align: center;
            vertical-align: middle !important;
        }

        .demo-table .text-cell {
            min-width: 260px;
            text-align: left;
        }

        .demo-table audio {
            width: 200px;
        }

        .language-title {
            margin-top: 35px;
            margin-bottom: 5px;
        }

        @media (max-width: 767px) {
            .container {
                padding-left: 15px !important;
                padding-right: 15px !important;
            }
        }
    </style>
</head>

<body>
<div class="container page-container">
    <main role="main">
        <div class="container pt-5 mt-5 shadow p-5 mb-5 bg-white rounded">
            <div class="column has-text-centered">
                <h1 class="title is-1 publication-title"><b>DialectS2S:</b></h1>
                <h3 class="title is-3 publication-title">
                    End-to-End Speech Dialogue Modeling for Low-Resource Chinese Dialects
                </h3>
            </div>

            <br>

            <div class="column has-text-centered">
                <span class="link-block">
                    <a href="https://github.com/easy2lose/OpenS2S" target="_blank"
                       class="external-link button is-normal is-rounded is-dark">
                        <span class="icon"><i class="fab fa-github"></i></span>
                        <span>Github</span>
                    </a>
                </span>

                <span class="link-block">
                    <span class="button is-normal is-rounded is-light">
                        <span class="icon"><i class="ai ai-arxiv"></i></span>
                        <span>Paper (Coming Soon)</span>
                    </span>
                </span>

                <span class="link-block">
                    <span class="button is-normal is-rounded is-light">
                        <span class="icon"><i class="fas fa-cube"></i></span>
                        <span>Model (Coming Soon)</span>
                    </span>
                </span>

                <span class="link-block">
                    <span class="button is-normal is-rounded is-light">
                        <span class="icon"><i class="fas fa-database"></i></span>
                        <span>Dataset (Coming Soon)</span>
                    </span>
                </span>
            </div>
        </div>

        <div class="container pt-5 mt-5 shadow p-5 mb-5 bg-white rounded">
            <h3>Self-Aligned Speech Supervision:</h3>
            <img class="method-image" src="assets/method.png"
                 alt="Comparison of traditional supervised fine-tuning and self-aligned speech supervision">
        </div>

        <div class="container pt-5 mt-5 shadow p-5 mb-5 bg-white rounded">
            <h3>Speech-to-Speech Dialogue Demos:</h3>
            <div id="demo-root"></div>
        </div>
    </main>
</div>

<script src="demos.js"></script>
<script>
    const languageOrder = ["zh", "en", "sichuanese", "cantonese", "tianjin"];

    function makeAudio(path, label) {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.setAttribute("aria-label", label);

        const source = document.createElement("source");
        source.src = path;
        source.type = "audio/wav";
        audio.appendChild(source);
        audio.append("Your browser does not support the audio element.");
        return audio;
    }

    function makeCell(content, className) {
        const cell = document.createElement("td");
        if (className) cell.className = className;
        if (typeof content === "string") {
            cell.textContent = content;
        } else {
            cell.appendChild(content);
        }
        return cell;
    }

    function renderLanguage(language, examples) {
        const title = document.createElement("h4");
        title.className = "language-title";
        title.textContent = examples[0].language_name;

        const responsive = document.createElement("div");
        responsive.className = "table-responsive pt-3";

        const table = document.createElement("table");
        table.className = "table table-hover demo-table";
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Audio inputs</th>
                    <th>Transcript</th>
                    <th>Audio outputs</th>
                    <th>Text outputs</th>
                </tr>
            </thead>
        `;

        const body = document.createElement("tbody");
        examples.forEach((example) => {
            const row = document.createElement("tr");
            row.appendChild(makeCell(
                makeAudio(example.input_audio, `${language} input ${example.index}`)
            ));
            row.appendChild(makeCell(example.input_text, "text-cell"));
            row.appendChild(makeCell(
                makeAudio(example.output_audio, `${language} output ${example.index}`)
            ));
            row.appendChild(makeCell(example.output_text, "text-cell"));
            body.appendChild(row);
        });

        table.appendChild(body);
        responsive.appendChild(table);
        return [title, responsive];
    }

    const root = document.getElementById("demo-root");
    const examples = window.DIALECT_DEMOS || [];

    languageOrder.forEach((language) => {
        const languageExamples = examples.filter((example) => example.language === language);
        if (languageExamples.length) {
            renderLanguage(language, languageExamples).forEach((element) => root.appendChild(element));
        }
    });
</script>
</body>
</html>
